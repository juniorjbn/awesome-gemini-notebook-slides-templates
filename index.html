<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Awesome Gemini Notebook Slides Templates</title>
<style>
  :root {
    --bg: #12100d;
    --panel: #1c1915;
    --paper: #e8e0d0;
    --paper-dim: #b8ae99;
    --accent: #e0a82e;
    --code-bg: #14120f;
    --border: #3a352c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--paper);
    font-family: "Courier New", Courier, monospace;
  }

  /* ---------- Deck ---------- */
  #deck { position: relative; height: 100vh; }
  .slide {
    position: absolute;
    inset: 0;
    display: none;
    padding: 28px 32px 72px;
    overflow: hidden;
  }
  .slide.active { display: flex; gap: 28px; }

  /* Cover slide */
  .slide.cover {
    padding: 0;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  .slide.cover img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .cover-hint {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.7);
    border: 1px solid var(--border);
    padding: 8px 18px;
    font-size: 13px;
    color: var(--paper-dim);
    border-radius: 20px;
  }

  /* Template slides: image half + code half */
  .half {
    width: 50%;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .half.images { gap: 14px; overflow-y: auto; }
  .half.images img {
    max-width: 100%;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #000;
  }
  .slide-title { font-size: 22px; color: var(--accent); margin-bottom: 4px; }
  .slide-group {
    font-size: 11px;
    color: var(--paper-dim);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .slide-desc { font-size: 13px; color: var(--paper-dim); margin-bottom: 14px; line-height: 1.5; }

  .code-box {
    position: relative;
    flex: 1;
    min-height: 0;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
  }
  .code-box .code-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--paper-dim);
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .copy-btn {
    background: var(--accent);
    color: #12100d;
    border: none;
    font-family: inherit;
    font-weight: bold;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
  }
  .copy-btn:hover { filter: brightness(1.1); }
  .code-box pre {
    flex: 1;
    overflow: auto;               /* scroll interno — não rola a página */
    padding: 14px;
    font-size: 12.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    color: #d6cdb8;
  }

  /* Cover parallax */
  .plx-stage {
    position: relative;
    width: min(100%, calc(100vh * (1672 / 941)));
    aspect-ratio: 1672 / 941;
    overflow: hidden;
  }
  .plx {
    position: absolute;
    inset: 0;
    pointer-events: none;
    transition: transform .18s ease-out;
    will-change: transform;
  }
  .plx img { width: 100%; height: 100%; display: block; }
  .hotspot {
    position: absolute;
    background: transparent;
    border: none;
    cursor: pointer;
    pointer-events: auto;
  }
  .plx:has(.hotspot:hover) { filter: drop-shadow(0 0 14px rgba(224, 168, 46, .75)); }

  /* Section cover slides */
  .slide.section-cover {
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 12px;
  }
  .section-cover .sec-num {
    font-size: 13px;
    color: var(--paper-dim);
    letter-spacing: 5px;
    text-transform: uppercase;
  }
  .section-cover h2 { font-size: 44px; color: var(--accent); }
  .section-cover p {
    color: var(--paper-dim);
    font-size: 14px;
    max-width: 620px;
    line-height: 1.7;
  }

  /* Intro slide (how to use content prompts) */
  .slide.intro { flex-direction: column; justify-content: center; align-items: center; }
  .intro-box { max-width: 780px; }
  .intro-box h2 { color: var(--accent); font-size: 26px; margin-bottom: 18px; }
  .intro-box li {
    color: var(--paper);
    font-size: 14px;
    line-height: 1.7;
    margin: 0 0 14px 20px;
  }
  .intro-box li strong { color: var(--accent); }

  /* PAIR WITH chip on content prompt slides */
  .pair-chip {
    display: inline-block;
    background: #2b261d;
    border: 1px dashed var(--accent);
    color: var(--accent);
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 6px;
    margin-top: 12px;
  }

  /* Sources slide */
  .slide.sources { flex-direction: column; justify-content: center; align-items: center; gap: 18px; }
  .slide.sources a { color: var(--accent); font-size: 15px; word-break: break-all; }
  .slide.sources h2 { color: var(--paper); font-size: 26px; margin-bottom: 8px; }

  /* ---------- Bottom controls (overlay) ---------- */
  #controls {
    position: fixed;
    bottom: 14px;
    right: 20px;
    display: flex;
    gap: 10px;
    align-items: center;
    z-index: 10;
  }
  #controls .counter { font-size: 12px; color: var(--paper-dim); margin-right: 4px; }
  .arrow-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(28, 25, 21, .85);
    color: var(--accent);
    font-size: 18px;
    cursor: pointer;
  }
  .arrow-btn:hover { background: #2b261d; }

  @media (max-width: 900px) {
    .slide.active { flex-direction: column; overflow-y: auto; }
    .half { width: 100%; }
    .code-box pre { max-height: 50vh; }
  }
</style>
</head>
<body>

<main id="deck"></main>

<div id="controls">
  <span class="counter" id="counter"></span>
  <button class="arrow-btn" id="home" title="Home (⌂)">⌂</button>
  <button class="arrow-btn" id="prev" title="Previous (←)">←</button>
  <button class="arrow-btn" id="next" title="Next (→)">→</button>
</div>

addSlide(cover);

// Parallax: camadas se movem sutilmente com o mouse, mais rápido quanto mais à frente
const plxLayers = cover.querySelectorAll(".plx[data-depth]");
cover.addEventListener("mousemove", (e) => {
  const r = cover.querySelector("#plx-stage").getBoundingClientRect();
  const dx = (e.clientX - r.left) / r.width - 0.5;
  const dy = (e.clientY - r.top) / r.height - 0.5;
  plxLayers.forEach((l) => {
    const d = parseFloat(l.dataset.depth);
    l.style.transform = `translate3d(${(-dx * d).toFixed(1)}px, ${(-dy * d).toFixed(1)}px, 0)`;
  });
});
cover.addEventListener("mouseleave", () => plxLayers.forEach((l) => (l.style.transform = "")));

  "The how of a deck — palette, typography, layout language. Pick a visual world and paste its prompt after your content prompt.");

// Template slides
for (const t of TEMPLATES) {
  const s = document.createElement("section");
  const imgs = t.images.map(src => `<img src="${src}" alt="${t.title} example" loading="lazy">`).join("");
  s.innerHTML = `
    <div class="half images">
      <div>
        <div class="slide-group">${t.group || ""}</div>
        <div class="slide-title">${t.title}</div>
        <div class="slide-desc">${t.desc || ""}</div>
      </div>
      ${imgs}
    </div>
    <div class="half">
      <div class="code-box">
        <div class="code-head"><span>prompt</span><button class="copy-btn">Copy</button></div>
        <pre></pre>
      </div>
    </div>`;
  s.querySelector("pre").textContent = t.prompt;
  s.querySelector(".copy-btn").onclick = (e) => {
    navigator.clipboard.writeText(t.prompt).then(() => {
      e.target.textContent = "Copied!";
      setTimeout(() => (e.target.textContent = "Copy"), 1500);
    });
  };
  addSlide(s);
}

// Sources
const src = document.createElement("section");
src.className = "sources";
src.innerHTML = `<h2>Sources</h2>` +
  SOURCES.map(s => `<a href="${s.url}" target="_blank" rel="noopener">${s.label}</a>`).join("") +
  `<p style="color:var(--paper-dim);font-size:12px;margin-top:24px">
     This is a living collection — more templates will be added over time.</p>
   <button class="copy-btn" id="back-home" style="margin-top:20px;padding:10px 22px;font-size:13px">⌂ Back to home</button>`;
src.querySelector("#back-home").onclick = () => go(0);
addSlide(src);

function go(i) {
  current = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s, k) => s.classList.toggle("active", k === current));
  document.getElementById("counter").textContent = `${current + 1} / ${slides.length}`;
}

document.getElementById("home").onclick = () => go(0);
document.getElementById("hs-content").onclick = () => go(contentStart);
document.getElementById("hs-slides").onclick = () => go(designStart);
document.getElementById("prev").onclick = () => go(current - 1);
document.getElementById("next").onclick = () => go(current + 1);
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "PageDown") go(current + 1);
  if (e.key === "ArrowLeft" || e.key === "PageUp") go(current - 1);
  if (e.key === "Home") go(0);
  if (e.key === "End") go(slides.length - 1);
});

go(0);
</script>
</body>
</html>
